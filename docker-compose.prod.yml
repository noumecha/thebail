# docker-compose.prod.yml
services:
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: thebail_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      # Augmenter les limites d'upload et d'exécution
      UPLOAD_LIMIT: 512M
      MEMORY_LIMIT: 2048M
      MAX_EXECUTION_TIME: 600
    ports:
      - '8081:80'
    depends_on:
      - db
    networks:
      - thebail_network

  db:
    env_file:
      - .env
    image: mysql:8.0
    container_name: thebail_db_prod
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data_prod:/var/lib/mysql
    networks:
      - thebail_network
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      timeout: 20s
      retries: 10

  web:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: thebail_web_prod
    restart: always
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120
    volumes:
      - static_volume_prod:/app/staticfiles
      - media_volume_prod:/app/uploads
    ports:
      - '8001:8000'
    environment:
      - DEBUG=False
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - thebail_network

volumes:
  mysql_data_prod:
  static_volume_prod:
  media_volume_prod:

networks:
  thebail_network:
    driver: bridge
