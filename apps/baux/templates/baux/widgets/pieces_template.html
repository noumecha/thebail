<div class="row" id="{{ element_groups_id }}" data-group-type="piece" data-max-items="9">
  {% for group in piece_groups %}
    <div class="col-md-6 col-block col-lg-4 mb-4">
      <table class="table table-bordered align-middle text-center">
        <thead class="table-light">
          <tr>
            <th class="p-0">Désignation</th>
            <th class="p-0">Nombre</th>
            <th class="p-0">Images</th>
          </tr>
        </thead>
        <tbody id="{{ element_groups_id }}-tbody" class="{{ element_groups_id }}-tbody">
          {% for el in group %}
            {% include "baux/widgets/piece_element_row.html" with el=el %}
          {% endfor %}
        </tbody>
      </table>
    </div>
  {% endfor %}
</div>

<div class="row">
  <div class="alert alert-success" style="display: none;" id="{{ element_groups_id }}-form-success"></div>
  <div class="alert alert-danger" style="display: none;" id="{{ element_groups_id }}-form-error"></div>
</div>

<div class="ps-2">
  <form method="POST" class="ps-2 d-flex" id="piece-collecte-form">
    {% csrf_token %}
    <input type="text" id="{{ element_groups_id }}-piece-collecte-input" name="libelle" class="form-control form-control-sm" placeholder="Ajouter une autre pièce ..." />
    <button type="button" id="{{ element_groups_id }}-add-piece-btn" class="btn btn-outline-primary btn-sm">+</button>
  </form>
</div>
