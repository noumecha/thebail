<div class="row" id="pieces-collecte-container" data-group-type="piece" data-max-items="9">
  {% for group in piece_groups %}
    <div class="col-md-6 col-block col-lg-4 mb-4">
      <table class="table table-bordered align-middle text-center">
        <thead class="table-light">
          <tr>
            <th class="p-0">Désignation</th>
            <th class="p-0">Quantité</th>
          </tr>
        </thead>
        <tbody id="pieces-collecte-container-tbody" class="pieces-collecte-container-tbody">
          {% for el in group %}
            <tr>
              <td class="d-flex ps-2 pe-0">
                <div class="d-flex form-check form-check-inline">
                  {{ el.statut_input }}
                  <label class="form-check-label ms-1">{{ el.libelle }}</label>
                </div>
              </td>
              <td class="p-0 align-items-center" style="width: 80px;">{{ el.nombre_input }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  {% endfor %}
</div>
