<div class="row" id="elements-collecte-container">
  {% for group in element_groups %}
    <div class="col-md-4 mb-4">
      <table class="table align-middle text-center">
        <thead class="table-light">
          <tr>
            <th class="p-0">Existence</th>
            <th class="bg-secondary-subtle p-0"></th>
            <th class="p-0">Quantité</th>
          </tr>
        </thead>
        <tbody id="elements-collecte-container-tbody" class="elements-collecte-container-tbody">
          {% for el in group %}
            <tr>
              <td class="d-flex ps-0 pe-0">
                <div class="form-check form-check-inline">
                  {{ el.statut_oui }}
                  <label class="form-check-label ms-1">Oui</label>
                </div>
                <div class="form-check form-check-inline">
                  {{ el.statut_non }}
                  <label class="form-check-label ms-1">Non</label>
                </div>
              </td>
              <td class="p-0 align-items-center text-start">{{ el.libelle }}</td>
              <td class="p-0 align-items-center" style="width: 80px;">{{ el.nombre_input }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  {% endfor %}
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  // exclusivité entre les checkboxes "oui" et "non"
  document.querySelectorAll(".statut-checkbox").forEach((checkbox) => {
    checkbox.addEventListener("change", (e) => {
      const group = e.target.getAttribute("data-group");
      if (e.target.checked) {
        document.querySelectorAll(`.statut-checkbox[data-group='${group}']`).forEach((cb) => {
          if (cb !== e.target) cb.checked = false;
        });
      }
    });
  });
});
</script>
