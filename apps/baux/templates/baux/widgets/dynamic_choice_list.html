<!-- layout for other fields -->
<div class="d-flex flex-column" id="{{ list_id }}-wrapper">
  <div class="d-flex justify-content-evenly flex-wrap">
    <div id="{{ list_id }}" class="flex-row gap-3 list-group flex-wrap" data-model="{{ model }}">
      {% for choice in choices %}
        <label class="d-flex align-items-center gap-2 dynamic-option">
          <input
            type="checkbox"
            name="{{ checkbox_name }}"
            value="{{ choice.id }}"
            class="form-check-input dynamic-check"
            data-choice-id="{{ choice.id }}"
            data-choice-label="{{ choice.libelle }}"
          >
          <span class="fw-bold">{{ choice.libelle }}</span>
        </label>
      {% endfor %}
      <input type="hidden" name="{{ hidden_name }}" id="{{ list_id }}-{{ hidden_id }}">
    </div>

    <!-- simple input for form -->
    <div class="ps-2 d-flex" id="{{ list_id }}-{{ add_wrapper_id }}">
      <form action="" method="POST" class="ps-2 d-flex" id="main-form">
        {% csrf_token %}
        <input type="text" class="form-control form-control-sm" placeholder="Autre ..." id="{{ list_id }}-{{ new_input_id }}">
        <button type="button" class="btn btn-outline-primary btn-sm" id="{{ list_id }}-{{ add_btn_id }}">+</button>
      </form>
    </div>
  </div>

  <!-- error block -->
  <div class="d-flex justify-content-center align-items-center m-2 d-none" id="{{ list_id }}-alert-block">
    <div class="alert alert-danger w-100 alert-dismissible fade show" role="alert">
        <span id="error-message" class="error-message"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
  </div>
</div>
