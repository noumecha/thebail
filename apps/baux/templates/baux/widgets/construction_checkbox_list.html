<div class="d-flex justify-content-evenly flex-wrap">
  <div id="construction-list" class="flex-row gap-3 list-group flex-wrap">
    {% for c in constructions %}
      <label class="d-flex align-items-center gap-2 construction-option">
        <input
          type="checkbox"
          name="construction_choice_checkbox"
          value="{{ c.libelle }}"
          class="form-check-input construction-check"
          {% if c.libelle == selected %}checked{% endif %}
        >
        <span class="fw-bold">{{ c.libelle }}</span>
      </label>
    {% endfor %}

    <input type="hidden" name="construction_choice" id="construction-choice-hidden">
  </div>
  <div class="d-flex" id="new-construction-wrapper">
    <input type="text" class="form-control form-control-sm" placeholder="Autre ..." id="new-construction-input">
    <button type="button" class="btn btn-outline-primary btn-sm" id="add-construction-btn">+</button>
  </div>
</div>
