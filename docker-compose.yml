# docker-compose.yml
version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: thebail_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-thebail_db}
      MYSQL_USER: ${DB_USER:-thebail_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-thebail_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - thebail_network
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      timeout: 20s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thebail_web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - '8000:8000'
    environment:
      - DEBUG=True
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-thebail_db}
      - DB_USER=${DB_USER:-thebail_user}
      - DB_PASSWORD=${DB_PASSWORD:-thebail_password}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - thebail_network

volumes:
  mysql_data:
  static_volume:
  media_volume:

networks:
  thebail_network:
    driver: bridge
